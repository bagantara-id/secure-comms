<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECURE TERMINAL</title>
    <style>
        :root {
            --bg-obsidian: #050608;
            --surface-glass: rgba(15, 20, 25, 0.85);
            --accent-cyan: #00f3ff;
            --accent-red: #ff003c;
            --text-main: #f1f5f9;
            --text-muted: #8b9bb4;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-obsidian); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        #strobeLayer { position: absolute; inset: 0; background: #fff; z-index: 9998; display: none; }
        #redStrikeScreen { position: absolute; inset: 0; background: var(--accent-red); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .strike-text { font-family: monospace; color: #fff; font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 20px #000; animation: blink 0.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .overlay-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .upload-spinner { width: 40px; height: 40px; border: 3px solid rgba(0,243,255,0.1); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 16px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .media-menu-box { background: #0c1017; border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; width: 80%; max-width: 300px; box-shadow: 0 10px 30px rgba(0,0,0,0.9); }
        .btn-menu-option { background: transparent; border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); padding: 14px; border-radius: 8px; font-family: monospace; font-size: 13px; font-weight: bold; cursor: pointer; text-align: left; display: flex; align-items: center; gap: 12px; }
        .btn-menu-option:active { background: rgba(0, 243, 255, 0.1); border-color: var(--accent-cyan); }
        .btn-close-menu { background: var(--accent-red); color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }

        .cyber-header { background: var(--surface-glass); border-bottom: 1px solid rgba(0, 243, 255, 0.1); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .timer { font-family: monospace; font-size: 16px; font-weight: bold; color: var(--accent-cyan); letter-spacing: 1px; }
        .btn-ping { background: transparent; border: 1px solid rgba(0, 243, 255, 0.3); color: var(--accent-cyan); border-radius: 6px; padding: 6px 12px; font-size: 11px; font-weight: bold; cursor: pointer; }

        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; z-index: 2; position: relative; scroll-behavior: smooth; }

        .input-area { background: var(--surface-glass); border-top: 1px solid rgba(0, 243, 255, 0.1); padding: 12px 16px; display: flex; gap: 8px; align-items: center; z-index: 10; }
        .btn-taktis { background: #0c1017; border: 1px solid rgba(255,255,255,0.1); color: var(--accent-cyan); width: 42px; height: 42px; border-radius: 50%; font-size: 18px; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
        .btn-taktis:active { background: rgba(0,243,255,0.1); border-color: var(--accent-cyan); }
        .chat-input { flex: 1; background: #000; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 16px; border-radius: 20px; outline: none; font-size: 14px; }
        .chat-input:focus { border-color: var(--accent-cyan); }
        .btn-send { background: var(--accent-cyan); color: #000; border: none; border-radius: 20px; padding: 0 16px; font-weight: bold; height: 42px; font-size: 12px; }

    </style>
</head>
<body oncontextmenu="return false;">

    <div id="strobeLayer"></div>
    
    <div id="uploadOverlay" class="overlay-screen">
        <div class="upload-spinner"></div>
        <div style="font-family: monospace; color: var(--accent-cyan); font-size: 11px; letter-spacing: 1px;">MENGAMANKAN PAYLOAD...</div>
    </div>

    <div id="mediaMenuOverlay" class="overlay-screen">
        <div class="media-menu-box">
            <div style="font-family: monospace; font-size: 10px; color: var(--text-muted); text-align: center; margin-bottom: 8px;">PILIH SUMBER MEDIA</div>
            <button class="btn-menu-option" id="btnOptCamera">🔴 KAMERA LIVE</button>
            <button class="btn-menu-option" id="btnOptGallery">📁 GALERI LOKAL</button>
            <button class="btn-close-menu" id="btnCloseMediaMenu">BATAL</button>
        </div>
    </div>

    <div id="redStrikeScreen">
        <i class="strike-text" style="font-size: 4rem; margin-bottom: 16px;">!</i>
        <div class="strike-text">PELANGGARAN TERDETEKSI.<br>SEKALI LAGI = HANGUS.</div>
    </div>

    <header class="cyber-header">
        <div class="timer" id="countdownDisplay">--:--:--</div>
        <button class="btn-ping" id="btnPing">PING</button>
    </header>

    <main class="chat-container" id="chatStream">
        <div style="text-align:center; font-size:10px; color:#555; font-family:monospace; margin-top:8px;">[ END-TO-END ENCRYPTION ]</div>
    </main>

    <footer class="input-area">
        <input type="file" id="guestCameraUpload" style="display:none;" accept="image/*,video/*" capture="environment">
        <input type="file" id="guestGalleryUpload" style="display:none;" accept="image/*,video/*">
        
        <button class="btn-taktis" id="btnAttach">+</button>
        <button class="btn-taktis" id="btnGeo" style="display: none;" title="Kirim Lokasi Akurat">📍</button>
        <input type="text" class="chat-input" id="chatInput" placeholder="Ketik pesan..." autocomplete="off">
        <button class="btn-send" id="btnSend">KIRIM</button>
    </footer>

    <script type="module" src="./js/guest-app.js"></script>
</body>
</html>
