<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SECURE CHANNEL</title>
    <style>
        :root { --bg-obsidian: #050608; --surface-glass: rgba(15, 20, 25, 0.7); --accent-cyan: #00f3ff; --accent-red: #ff003c; --text-main: #f1f5f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; outline: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-obsidian); color: var(--text-main); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; position: relative; background-image: radial-gradient(circle at 50% 0%, rgba(0, 243, 255, 0.05) 0%, transparent 60%); }

        /* OVERLAYS MUTLAK */
        #blindSpotOverlay { position: absolute; inset: 0; background: #000; z-index: 9998; display: none; flex-direction: column; align-items: center; justify-content: center; color: var(--accent-red); font-family: monospace; font-size: 14px; font-weight: bold; text-align: center; }
        #redStrikeScreen { position: absolute; inset: 0; background: var(--accent-red); z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
        .strike-text { font-family: monospace; color: #fff; font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 20px #000; animation: blink 0.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        #uploadOverlay { position: absolute; inset: 0; background: rgba(0,0,0,0.8); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .upload-spinner { width: 40px; height: 40px; border: 3px solid rgba(0,243,255,0.2); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 12px; }
        .upload-text { font-family: monospace; color: var(--accent-cyan); font-size: 12px; letter-spacing: 1px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* UI ELEMENTS */
        .cyber-header { background: var(--surface-glass); border-bottom: 1px solid rgba(0, 243, 255, 0.1); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 10; }
        .timer { font-family: monospace; font-size: 18px; font-weight: bold; color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0,243,255,0.4); }
        .btn-ping { background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); border-radius: 6px; padding: 6px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .warning-banner { background: rgba(255, 0, 60, 0.1); border-bottom: 1px solid rgba(255, 0, 60, 0.4); color: var(--accent-red); text-align: center; padding: 8px; font-family: monospace; font-size: 10px; font-weight: bold; letter-spacing: 1px; box-shadow: 0 4px 15px rgba(255, 0, 60, 0.1); animation: pulseWarning 2s infinite; z-index: 5; }
        @keyframes pulseWarning { 0%, 100% { opacity: 0.8; box-shadow: 0 0 5px rgba(255,0,60,0.2); } 50% { opacity: 1; box-shadow: 0 0 15px rgba(255,0,60,0.5); } }

        .chat-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .msg-bubble { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.5; animation: slideUp 0.3s ease-out; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .msg-guest { align-self: flex-end; background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.3); border-right: 3px solid var(--accent-cyan); }
        .msg-admin { align-self: flex-start; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-left: 3px solid #d4af37; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-download { display: inline-block; margin-top: 10px; padding: 8px 12px; background: rgba(0,243,255,0.1); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); font-size: 11px; font-weight: bold; text-decoration: none; border-radius: 4px; }

        .input-area { background: var(--surface-glass); border-top: 1px solid rgba(0, 243, 255, 0.1); padding: 12px 16px; display: flex; gap: 10px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); align-items: center; }
        .btn-attach { background: transparent; border: 1px solid var(--accent-cyan); color: var(--accent-cyan); width: 40px; height: 40px; border-radius: 8px; font-size: 20px; display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
        .chat-input { flex: 1; background: #000; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px; border-radius: 8px; outline: none; font-family: monospace; font-size: 13px; }
        .chat-input:focus { border-color: var(--accent-cyan); }
        .btn-send { background: var(--accent-cyan); color: #000; border: none; border-radius: 8px; padding: 0 16px; font-weight: bold; height: 40px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="blindSpotOverlay">[ PROTEKSI PRIVASI AKTIF ]<br>KONTEN DISEMBUNYIKAN</div>
    
    <div id="uploadOverlay">
        <div class="upload-spinner"></div>
        <div class="upload-text">MENGENKRIPSI & MENTRANSMISIKAN MEDIA...</div>
    </div>

    <div id="redStrikeScreen">
        <i class="strike-text" style="font-size: 4rem; margin-bottom: 20px;">!</i>
        <div class="strike-text" id="strikeMessage">PELANGGARAN TERDETEKSI.<br>SATU KALI LAGI, DATA DIHANCURKAN.</div>
    </div>

    <header class="cyber-header">
        <div class="timer" id="countdownDisplay">--:--:--</div>
        <button class="btn-ping" id="btnPing">PING</button>
    </header>

    <div class="warning-banner">
        SISTEM KEAMANAN AKTIF // MEDIA TIDAK DAPAT DI-SCREENSHOT // GUNAKAN TOMBOL UNDUH
    </div>

    <main class="chat-container" id="chatStream">
        <div style="text-align:center; font-size:11px; color:#666; font-family:monospace; margin-top:10px;">[ ENKRIPSI END-TO-END AKTIF ]</div>
    </main>

    <footer class="input-area">
        <input type="file" id="guestMediaUpload" style="display:none;" accept="image/*,video/*" capture="environment">
        <button class="btn-attach" id="btnAttach">+</button>
        <input type="text" class="chat-input" id="chatInput" placeholder="Ketik transmisi..." autocomplete="off">
        <button class="btn-send" id="btnSend">KIRIM</button>
    </footer>

    <script type="module" src="./js/guest-app.js"></script>
</body>
</html>
