<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP Secure Channel</title>
    <style>
        :root {
            /* Tema Malam (Default) - Obsidian & Cyan */
            --bg-color: #050914;
            --surface: rgba(10, 15, 25, 0.6);
            --surface-modal: rgba(15, 22, 36, 0.85);
            --border-color: rgba(0, 243, 255, 0.2);
            --border-highlight: rgba(0, 243, 255, 0.5);
            --accent: #00f3ff;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-3d: 0 10px 40px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.1);
            --font-mono: 'Courier New', Courier, monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        [data-theme="light"] {
            /* Tema Siang - Frost White & Sapphire */
            --bg-color: #f1f5f9;
            --surface: rgba(255, 255, 255, 0.6);
            --surface-modal: rgba(255, 255, 255, 0.9);
            --border-color: rgba(14, 165, 233, 0.2);
            --border-highlight: rgba(14, 165, 233, 0.6);
            --accent: #0ea5e9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --shadow-3d: 0 10px 40px rgba(14, 165, 233, 0.15), inset 0 1px 0 rgba(255,255,255,0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-sans);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            background-image: radial-gradient(circle at 50% 0%, var(--surface) 0%, transparent 70%);
        }

        /* 3D Glassmorphism Modal */
        #briefingModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 1;
            transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #briefingModal.fade-out {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }

        .briefing-content {
            background: var(--surface-modal);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 480px;
            text-align: center;
            box-shadow: var(--shadow-3d);
            transform: translateY(0);
        }

        .briefing-title {
            color: var(--accent);
            font-family: var(--font-sans);
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 16px;
            font-size: 22px;
        }

        .briefing-text {
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 32px;
            color: var(--text-muted);
        }

        .btn-proceed {
            background: linear-gradient(135deg, var(--accent), var(--border-highlight));
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 32px;
            font-family: var(--font-sans);
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-proceed:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* HUD Header 3D */
        .hud-header {
            background: var(--surface);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 10;
        }

        .timer-display {
            font-family: var(--font-mono);
            font-size: 20px;
            font-weight: bold;
            color: var(--accent);
            text-shadow: 0 0 10px var(--border-color);
        }

        .header-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn-toggle-theme {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 50%;
            width: 36px; height: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 16px;
        }

        .btn-ping {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 8px;
            padding: 8px 16px;
            font-family: var(--font-sans);
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-ping:active {
            background: var(--accent);
            color: #fff;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Input Area 3D */
        .input-area {
            padding: 16px;
            background: var(--surface);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .chat-input {
            flex: 1;
            background: rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 12px;
            font-family: var(--font-sans);
            outline: none;
            font-size: 14px;
        }

        .chat-input:focus {
            border-color: var(--accent);
            box-shadow: inset 0 0 0 1px var(--accent);
        }

        .btn-action {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 0 20px;
            font-family: var(--font-sans);
            font-weight: bold;
            cursor: pointer;
        }

        #drmOverlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div id="briefingModal">
        <div class="briefing-content">
            <h2 class="briefing-title">VIP SECURE CHANNEL</h2>
            <p class="briefing-text">
                Saluran komunikasi eksklusif telah disiapkan untuk Anda. Akses ini bersifat tunggal dan dienkripsi secara mutlak. Seluruh data akan dihancurkan tanpa jejak setelah sesi berakhir.
            </p>
            <button class="btn-proceed" id="btnProceed">Konfirmasi Akses</button>
        </div>
    </div>

    <div id="drmOverlay"></div>

    <header class="hud-header">
        <div class="timer-display" id="countdownDisplay">--:--:--</div>
        <div class="header-controls">
            <button class="btn-toggle-theme" id="btnTheme">🌓</button>
            <button class="btn-ping" id="btnPing">PING</button>
        </div>
    </header>

    <main class="chat-container" id="chatStream"></main>

    <footer class="input-area">
        <input type="file" id="mediaUpload" style="display: none;" accept="image/*,video/*">
        <button class="btn-action" id="btnAttach" style="background: transparent; color: var(--accent); border: 1px solid var(--accent);">+</button>
        <input type="text" class="chat-input" id="chatInput" placeholder="Ketik pesan aman...">
        <button class="btn-action" id="btnSend">KIRIM</button>
    </footer>

    <audio id="sfxAccept" src="assets/accept.mp3" preload="auto"></audio>
    <audio id="sfxIncoming" src="assets/incoming.mp3" preload="auto"></audio>

    <script type="module" src="./js/guest-app.js"></script>
</body>
</html>
